name: Build OrangeFox LI7

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v2
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          preinstalled-runtimes: false
          swap-storage: false

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git git-lfs gnupg \
            gperf imagemagick lib32ncurses-dev \
            lib32readline-dev lib32z1-dev libelf-dev \
            liblz4-tool libncurses-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip \
            zlib1g-dev aria2 python-is-python3

      - name: Install Android Repo Tool
        run: |
          mkdir -p "$HOME/bin"
          curl -o "$HOME/bin/repo" \
            https://storage.googleapis.com/git-repo-downloads/repo
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync OrangeFox Sources
        run: |
          mkdir -p "$GITHUB_WORKSPACE/OrangeFox_sync"

          git clone https://gitlab.com/OrangeFox/sync.git \
            "$GITHUB_WORKSPACE/OrangeFox_sync/sync"

          cd "$GITHUB_WORKSPACE/OrangeFox_sync/sync"

          ./orangefox_sync.sh --branch 12.1 \
            --path "$GITHUB_WORKSPACE/fox_12.1"

      - name: Patch OrangeFox Envsetup Optional File Check
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/fox_12.1"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build/make/envsetup.sh")
          if not path.is_file():
              raise SystemExit(f"Expected OrangeFox envsetup file not found: {path}")

          content = path.read_text()
          old = '[ -s $FOX_MANIFEST_ROOT/frameworks/base/services/core/xsd/vts/Android.mk ] && echo -n "" > $FOX_MANIFEST_ROOT/frameworks/base/services/core/xsd/vts/Android.mk'
          new = """if [ -s "$FOX_MANIFEST_ROOT/frameworks/base/services/core/xsd/vts/Android.mk" ]; then
              : > "$FOX_MANIFEST_ROOT/frameworks/base/services/core/xsd/vts/Android.mk"
          fi"""

          if old in content:
              content = content.replace(old, new, 1)
          elif new not in content:
              raise SystemExit("Expected OrangeFox optional Android.mk check not found; stopping safely.")

          path.write_text(content)
          print("OrangeFox envsetup optional-file check patched successfully.")
          PY

      - name: Clone LI7 Device Tree
        run: |
          cd "$GITHUB_WORKSPACE/fox_12.1"

          git clone \
            -b fox_12.1-hios15 \
            https://github.com/transsion-mt6789-recovery/twrp-device_tecno_TECNO-LI7.git \
            device/tecno/TECNO-LI7

      - name: Patch LI7 Device Setup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("fox_12.1/device/tecno/TECNO-LI7/vendorsetup.sh")
          content = path.read_text()

          old_shell = "THIS_DEVICE=${BASH_ARGV[2]}"
          new_shell = 'THIS_DEVICE="${BASH_ARGV[2]:-$BASH_SOURCE}"'
          if old_shell in content:
              content = content.replace(old_shell, new_shell, 1)
          elif new_shell not in content:
              raise SystemExit("LI7 shell-detection line not found; stopping safely.")

          old_clone = "git clone https://android.googlesource.com/platform/external/gflags/ -b android-12.1.0_r4 external/gflags"
          new_clone = """if [ ! -d external/gflags ]; then
          	echo "external/gflags not found; cloning Android 12.1 source ..."
          	git clone https://android.googlesource.com/platform/external/gflags/ -b android-12.1.0_r4 external/gflags
          else
          	echo "external/gflags already exists; skipping duplicate clone."
          fi"""

          if old_clone in content:
              content = content.replace(old_clone, new_clone, 1)
          elif "external/gflags already exists; skipping duplicate clone." not in content:
              raise SystemExit("Expected gflags clone command not found; stopping safely.")

          old_common = "https://github.com/transsion-mt6789/twrp-device_transsion_mt6789-common.git"
          new_common = "https://github.com/transsion-mt6789-recovery/twrp-device_transsion_mt6789-common.git"
          if old_common in content:
              content = content.replace(old_common, new_common, 1)
          elif new_common not in content:
              raise SystemExit("Expected mt6789-common repository URL not found; stopping safely.")

          old_common_clone = "git clone $URL -b fox_12.1-tranos15 $common"
          new_common_clone = """mkdir -p "$(dirname "$common")"
          echo "Cloning common tree branch fox_12.1-tranos15 from $URL ..."
          git clone --branch fox_12.1-tranos15 --single-branch "$URL" "$common"
          """
          if old_common_clone in content:
              content = content.replace(old_common_clone, new_common_clone.rstrip(), 1)
          elif 'git clone --branch fox_12.1-tranos15 --single-branch "$URL" "$common"' not in content:
              raise SystemExit("Expected common-tree clone command not found; stopping safely.")

          path.write_text(content)
          print("LI7 vendorsetup.sh patched successfully.")
          PY

      - name: Preflight Common Tree Clone
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/fox_12.1"
          set -euxo pipefail
          URL="https://github.com/transsion-mt6789-recovery/twrp-device_transsion_mt6789-common.git"
          BRANCH="fox_12.1-tranos15"
          DEST="device/transsion/mt6789-common"
          mkdir -p "$(dirname "$DEST")"
          echo "Checking remote branch..."
          git ls-remote --heads "$URL" "$BRANCH"
          echo "Cloning common tree with full diagnostic output..."
          GIT_TERMINAL_PROMPT=0 git -c http.version=HTTP/1.1 clone --verbose --progress --branch "$BRANCH" --single-branch "$URL" "$DEST"
          echo "Common tree clone completed."
          test -f "$DEST/BoardConfigCommon.mk" || { echo "Expected BoardConfigCommon.mk missing"; exit 1; }

      - name: Build OrangeFox
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/fox_12.1"

          # GitHub Actions already enables -e and -o pipefail for this Bash step.
          # Do not enable -u: Android envsetup.sh relies on some unset variables.
          set -o pipefail
          trap 'rc=$?; printf "::error::Command failed (exit %s): %s (line %s)\\n" "$rc" "$BASH_COMMAND" "${BASH_LINENO[0]}"; exit "$rc"' ERR
          PS4='+ [${BASH_SOURCE##*/}:${LINENO}] '

          mkdir -p "$HOME/Magisk"
          mkdir -p "$GITHUB_WORKSPACE/fox_12.1/.ccache"

          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=LI7
          export LC_ALL=C
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache

          echo "Starting build/envsetup.sh with Bash xtrace enabled..."
          set -x
          source build/envsetup.sh
          set +x
          echo "build/envsetup.sh completed; starting lunch..."
          lunch twrp_LI7-eng

          echo "Lunch completed; starting vendorbootimage build..."
          mka -j4 adbd vendorbootimage

      - name: Fix Build Output Permissions
        if: always()
        shell: bash
        run: |
          for dir in \
            fox_12.1/out/target/product/TECNO-LI7 \
            fox_12.1/out/target/product/LI7; do
            if [ -d "$dir" ]; then
              echo "Fixing read and directory traversal permissions: $dir"
              sudo chmod -R a+rX "$dir"
            fi
          done

      - name: Stage Flashable Build Images
        if: always()
        shell: bash
        run: |
          set -e
          STAGE="$GITHUB_WORKSPACE/orangefox-artifacts"
          mkdir -p "$STAGE"

          DIR="fox_12.1/out/target/product/TECNO-LI7"
          if [ -d "$DIR" ]; then
            echo "Staging flashable outputs from $DIR"
            while IFS= read -r -d '' file; do
              name="$(basename "$file")"
              echo "Staging $name"
              cp -L "$file" "$STAGE/$name"
            done < <(find "$DIR" -maxdepth 1 -type f \( -name '*.img' -o -name '*.zip' \) -print0)
          else
            echo "::error::Build output directory not found: $DIR"
            exit 1
          fi

          echo "Staged artifact files:"
          find "$STAGE" -maxdepth 1 -type f -printf '%f (%s bytes)\\n' | sort

      - name: Upload Build Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-LI7-Build
          path: orangefox-artifacts/
          if-no-files-found: warn
          retention-days: 7
